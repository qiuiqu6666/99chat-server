# robot-service 切流配置
# 放到 /www/server/panel/vhost/nginx/proxy/iosapi.99chat.chat/ 目录下
# （与现有 39a04a…_iosapi.99chat.chat.conf 同目录，nginx 最长前缀匹配优先，
#  以下 location 会覆盖 ^~ / 的兜底转发）
# 生效：nginx -t && nginx -s reload

#PROXY-START/

location ^~ /
{
    proxy_pass http://47.239.60.107:8081;
    proxy_set_header Host 47.239.60.107;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_http_version 1.1;
    # proxy_hide_header Upgrade;

    add_header X-Cache $upstream_cache_status;

    #Set Nginx Cache
    
    
    set $static_fileTkoTHvi0 0;
    if ( $uri ~* "\.(gif|png|jpg|css|js|woff|woff2)$" )
    {
    	set $static_fileTkoTHvi0 1;
    	expires 1m;
        }
    if ( $static_fileTkoTHvi0 = 0 )
    {
    add_header Cache-Control no-cache;
    }
}

#PROXY-END/
# ---- Windows 机器人内部接口（含 machine 申码/配对/开启）----
location ^~ /api/internal/robot {
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
}

