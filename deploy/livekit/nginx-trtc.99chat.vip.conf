# Install:
#   cp deploy/livekit/nginx-trtc.99chat.vip.conf /www/server/panel/vhost/nginx/trtc.99chat.vip.conf
#   nginx -t && nginx -s reload
#
# SSL: place fullchain/privkey under /www/server/panel/vhost/cert/trtc.99chat.vip/

server {
    listen 80;
    server_name trtc.99chat.vip;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/java_node_ssl;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name trtc.99chat.vip;

    ssl_certificate     /www/server/panel/vhost/cert/trtc.99chat.vip/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/trtc.99chat.vip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_LK:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # LiveKit signaling (HTTP + WebSocket)
    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    access_log /www/wwwlogs/trtc.99chat.vip.log;
    error_log  /www/wwwlogs/trtc.99chat.vip.error.log;
}
