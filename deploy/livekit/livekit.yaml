# LiveKit — trtc.99chat.vip
# Signaling: Nginx TLS terminates wss://trtc.99chat.vip → 127.0.0.1:7880
# Media UDP: 50000-60000 (open in cloud security group)

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
  node_ip: "47.239.60.107"

# UDP TURN on same host; signaling TLS is on Nginx :443
turn:
  enabled: true
  domain: trtc.99chat.vip
  udp_port: 3478
  external_tls: false

# keys filled by apply-config.sh from .api_key / .api_secret
keys:
  PLACEHOLDER_KEY: PLACEHOLDER_SECRET

webhook:
  urls:
    - https://api99chat.99chat.vip/webhook/livekit
  api_key: PLACEHOLDER_KEY

logging:
  level: info

room:
  empty_timeout: 300
  departure_timeout: 20
  max_participants: 2
