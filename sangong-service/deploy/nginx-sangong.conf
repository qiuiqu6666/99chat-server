# 三公 Java 服务 nginx 配置
# 方案：nginx 监听 8088 反代 Java（Java 实际监听 18088），SSE 长连接透传。
# 若不经 nginx，可让 Java 直接监听 8088（.env 设 SANGONG_PORT=8088）并删除本文件。
#
# 使用：
#   1) .env 设 SANGONG_PORT=18088
#   2) 复制本文件到 nginx vhost 目录并 reload

upstream sangong_java {
    server 127.0.0.1:18088;
    keepalive 16;
}

server {
    listen 8088;
    server_name _;

    client_max_body_size 10m;

    # SSE 实时流：关闭缓冲，长超时
    location /api/v1/admin/events/stream {
        proxy_pass http://sangong_java;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # 报表图片静态目录（Java 写入 data/bet-reports）
    location /bet-reports/ {
        alias /www/wwwroot/99chat-server/sangong-service/data/bet-reports/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://sangong_java;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
